      <a href="store.html" class="sidebar-link">
        <span class="sidebar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2l-4 6v13h20V8l-4-6H6Z"/>
            <path d="M2 8h20"/>
            <path d="M16 8a4 4 0 0 1-8 0"/>

  <!-- =========================
       SITE HEADER
       ========================= -->
  <header class="navbar">
    <a href="index.html" class="logo" aria-label="RI Student Environment home">
      <img src="Rosebank Logo.webp" alt="RI Student Environment logo" width="160">
    </a>

    <nav class="nav-links" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="impact.html">Impact</a>
      <a href="programs.html">Programs</a>

    <div class="nav-actions">
      <a href="login.html" class="login-link">Login</a>
      <a href="register.html" class="register-btn">Join Us</a>
    </div>
  </header>

  <!-- =========================
       WHATSAPP-STYLE CHAT
       ========================= -->
  <main class="chat-main">
    <div class="wa-app">

      <!-- LEFT PANEL: Chat List -->
      <aside class="wa-sidebar" id="waSidebar">
        <!-- Profile Header -->
        <div class="wa-sidebar-header">
          <div class="wa-user-profile">
            <div class="wa-avatar wa-avatar-self" title="Your Profile">
              <span>YS</span>
            </div>
            <div class="wa-user-info">
              <strong>You</strong>
              <small>RI Student</small>
            </div>
          </div>
          <div class="wa-header-actions">
            <button type="button" class="wa-icon-btn" title="New chat" aria-label="New chat">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button type="button" class="wa-icon-btn" title="Menu" aria-label="Menu">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
          </div>
        </div>

        <!-- Search -->
        <div class="wa-search">
          <div class="wa-search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="chatSearch" placeholder="Search or start a new chat" aria-label="Search chats">
          </div>
        </div>

        <!-- Filters -->
        <div class="wa-filters">
          <button type="button" class="wa-filter active" data-filter="all">All</button>
          <button type="button" class="wa-filter" data-filter="unread">Unread</button>
          <button type="button" class="wa-filter" data-filter="groups">Groups</button>
          <button type="button" class="wa-filter" data-filter="opportunities">Opportunities</button>
        </div>

        <!-- Chat List -->
        <div class="wa-chat-list" id="chatList" role="list">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- RIGHT PANEL: Active Chat -->
<section class="wa-chat" id="waChat">

        <!-- Active Chat View -->
        <div class="wa-active-chat" id="activeChat" hidden>
          <!-- Chat Header -->
          <header class="wa-chat-header">
            <button type="button" class="wa-back-btn" id="backToList" aria-label="Back to chats">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="wa-chat-contact" id="chatContact">
              <div class="wa-avatar" id="chatAvatar"><span></span></div>
              <div class="wa-contact-info">
                <strong id="chatName"></strong>
                <small id="chatStatus">online</small>
              </div>
            </div>
            <div class="wa-chat-actions">
              <button type="button" class="wa-icon-btn" title="Search in chat" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
              <button type="button" class="wa-icon-btn" title="More options" aria-label="More">
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </button>
            </div>
          </header>

          <!-- Messages -->
          <div class="wa-messages" id="messagesArea" role="log" aria-live="polite">
            <!-- Populated by JS -->
          </div>

          <!-- Input Bar -->
          <footer class="wa-input-bar">
            <button type="button" class="wa-icon-btn" title="Emoji" aria-label="Emoji">
              <i class="fa-regular fa-face-smile"></i>
            </button>
            <button type="button" class="wa-icon-btn" title="Attach" aria-label="Attach file">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <div class="wa-input-wrap">
              <input type="text" id="messageInput" placeholder="Type a message" autocomplete="off" aria-label="Type a message">
            </div>
            <button type="button" class="wa-send-btn" id="sendBtn" title="Send" aria-label="Send message">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </footer>
        </div>
      </section>
    </div>
  </main>

  <!-- =========================
       SITE FOOTER (compact on chat page)
       ========================= -->
  <footer class="site-footer chat-footer">
    <div class="community-container">
      <div class="copyright">
        <p>&copy; 2026 RI Student Environment. All rights reserved.</p>
      </div>
    </div>
  </footer>
<script src="sidebar.js"></script>
<script src="community-chats.js"></script>
<script src="app.js"></script>
</body>
</html>
