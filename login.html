<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LogIn | RI Student Environment</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

  <!-- =========================
       SIGN IN PAGE
       ========================= -->

  <main class="lognin-container">

<!-- =========================
     LEFT BRANDING
     ========================= -->

<section class="login-brand">

  <a href="index.html" class="login">
    <img
      src="Rosebank Logo.webp"
      alt="RI Student Environment Logo"
    >
  </a>

  <div class="login-message">

    <span>WELCOME BACK</span>

    <h1>
      Connect.<br>
      Participate.<br>
      <strong>Grow.</strong>
    </h1>

    <p>
      Sign in to access your student community,
      events, programs, discussions and campus activities.
    </p>

  </div>

</section>


<!-- =========================
     SIGN IN FORM
     ========================= -->

<section class="login-form-section">

  <div class="signin-card">

    <div class="login-heading">

      <span>STUDENT PORTAL</span>

      <h2>Login</h2>

      <p>
        Welcome back! Please enter your details.
      </p>

    </div>


    <form class="login-form">

      <!-- Student Number -->

      <div class="form-group">

        <label for="student-email">
    Student Email
</label>

<input
    type="email"
    id="student-email"
    name="student-email"
    placeholder="Enter your student email"
    autocomplete="username"
    required
>

      </div>


      <!-- Password -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>


      <!-- Remember / Forgot -->

      <div class="login-options">

        <label class="remember-me">

          <input
            type="checkbox"
            name="remember-me"
          >

          <span>Remember me</span>

        </label>

        <a href="#" class="forgot-password-link">
          Forgot Password?
        </a>

      </div>


      <!-- Sign In -->

      <button
        type="submit"
        class="login-button"
      >
        login
      </button>

    </form>


    <!-- Divider -->

    <div class="login-divider">
      <span>OR</span>
    </div>


    <!-- Registration -->

    <div class="create-account">

      <p>
        Don't have an account?
      </p>

      <a href="register.html">
        Create Student Account
      </a>

    </div>


    <!-- Back Home -->

    <a
      href="index.html"
      class="back-home"
    >
      ← Back to Home
    </a>

  </div>

</section>

  </main>
<script src="app.js"></script>
</body>
</html>
